name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend and Railway image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out backend
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Test deployment configuration
        run: npm run test:deployment
      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          node --check index.js
          node --check knexfile.js
          find source scripts db_migrations -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Build Railway Docker image
        run: docker build --tag mini-hrms-backend:ci .
      - name: Verify production image configuration
        run: >-
          docker run --rm
          -e DB_HOST=mysql.railway.internal
          -e DB_PORT=3306
          -e DB_NAME=railway
          -e DB_USER=ci-user
          -e DB_PASSWORD=ci-placeholder
          -e PORTAL_SECURITY_KEY=ci-placeholder-not-a-live-secret
          -e CORS_ORIGINS=https://maheshpcse.github.io
          -e TRUST_PROXY=1
          mini-hrms-backend:ci npm run deploy:check
      - name: Deployment handoff
        shell: bash
        run: |
          echo '### Backend validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests and the Railway Docker image passed. No production credentials are needed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Railway deployment uses the connected GitHub repository and its configured main branch. Enable Railway Wait for CI to deploy only after this workflow succeeds.' >> "$GITHUB_STEP_SUMMARY"
